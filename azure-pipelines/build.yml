trigger: none

pr:
  branches:
    include:
    - main
    - releases/*

pool:
  vmImage: ubuntu-latest

steps:
- task: UseNode@1
  inputs:
    version: '24.x'
  displayName: 'Install Node.js'

- script: |
    npm install -g bun@1.3.14
    bun install --frozen-lockfile
    bun run build
  displayName: 'bun install and build'
